---
name: Code Linting

on:
  pull_request:
    paths: &paths
      - '**'
      - '!docs/**'
      - '!*.rst'
      - '!*.md'
      - '!.github/**'
      - '.github/workflows/lint.yml'

  push:
    branches:
      - develop
      - integrate_1.9
    paths: *paths

permissions: {}

# When a PR is updated, cancel the jobs from the previous version. Merges
# do not define head_ref, so use run_id to never cancel those jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        lintcommand:
          - "ruff check --output-format=github"
          - "mypy --follow-imports=silent cubedash/*.py cubedash/index/*.py cubedash/index/postg*/_api.py cubedash/startup_utils cubedash/summary cubedash/testutils integration_tests"
    name: Linting
    steps:
      - name: checkout git
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the project
        run: uv sync --locked --extra=test
      - name: Detect number of cores
        run: |
          CORES=$(nproc)
          echo "MYPY_NUM_WORKERS=$CORES" >> $GITHUB_ENV
      - name: run linter
        run: |
          uv run ${LINT_COMMAND}
        env:
          LINT_COMMAND: ${{matrix.lintcommand}}
          UV_PYTHON_PREFERENCE: managed
          MYPY_NUM_WORKERS: ${{ env.MYPY_NUM_WORKERS }}
