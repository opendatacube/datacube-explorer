---
name: Docker

on:
  workflow_dispatch:

  push:
    branches:
      - develop

  release:
    types: [published]

env:
  REGISTRY: ghcr.io

permissions: {}

# When a PR is updated, cancel the jobs from the previous version. Merges
# do not define head_ref, so use run_id to never cancel those jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Compute the git-describe based version/tags and reproducible-build epoch.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # setuptools_scm-compatible version string passed as EXPLORER_VERSION build-arg.
      version: ${{ steps.meta.outputs.version }}
      meta-tags: ${{ steps.meta.outputs.meta-tags }}
      # Base image name (registry/repo, no tag) consumed as meta-images.
      meta-images: ${{ steps.meta.outputs.meta-images }}
      # Repo URL for the source/url OCI labels (derived so forks are correct).
      repo-url: ${{ steps.meta.outputs.repo-url }}
      # Unix timestamp for reproducible builds (SOURCE_DATE_EPOCH build-arg).
      source-date-epoch: ${{ steps.meta.outputs.source-date-epoch }}
    steps:
      - name: Checkout git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute version, tags and build epoch
        id: meta
        env:
          # github.* context values consumed by the script below. Using env
          # avoids interpolating untrusted values directly into the shell.
          OWNER: ${{ github.repository_owner }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Image name: <registry>/<owner-lowercased>/explorer. Deriving the
          # owner from the running repo means this works in any fork without
          # editing the workflow (e.g. ghcr.io/omad/explorer in a fork).
          OWNER_LC=$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "meta-images=${REGISTRY}/${OWNER_LC}/explorer" >> "$GITHUB_OUTPUT"

          # Source/url labels point at the repo that actually built the image.
          echo "repo-url=${SERVER_URL}/${REPOSITORY}" >> "$GITHUB_OUTPUT"

          # Reproducible-build epoch: timestamp of the last commit that touched
          # files which affect the built image.
          SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct -- pyproject.toml uv.lock cubedash)
          echo "source-date-epoch=${SOURCE_DATE_EPOCH}" >> "$GITHUB_OUTPUT"

          if [ "${EVENT_NAME}" = "release" ]; then
            # Released image: vN.N.N AND :latest
            RELEASE_VERSION=$(git describe --abbrev=0 --tags)
            VERSION="${RELEASE_VERSION}"
            META_TAGS=$(printf '%s\n%s' \
              "type=raw,value=${RELEASE_VERSION}" \
              "type=raw,value=latest")
          else
            # Unstable (develop) build: full git describe tag only
            UNSTABLE_TAG=$(git describe --tags)
            # setuptools_scm compatible version string (replace -g with +g).
            VERSION="${UNSTABLE_TAG/-g/+g}"
            META_TAGS="type=raw,value=${UNSTABLE_TAG}"
          fi
          {
            echo "version=${VERSION}"
            echo "meta-tags<<EOF"
            echo "${META_TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # Build (and push) a combined linux/amd64 + linux/arm64
  # See https://docs.docker.com/build/ci/github-actions/github-builder/build/
  # for documentation on this docker maintained workflow.
  build:
    needs: prepare
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    permissions:
      contents: read      # fetch the repository content
      id-token: write     # sign attestations and cache entries via OIDC
      packages: write     # push to GHCR
      attestations: write # write the attestation storage record
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      # Generate an SBOM attestation (BuildKit emits SPDX) embedded in the image
      # index alongside the SLSA provenance. Viewable with
      # `docker buildx imagetools inspect <img> --format '{{ json .SBOM }}'`.
      sbom: true
      meta-images: ${{ needs.prepare.outputs.meta-images }}
      meta-tags: ${{ needs.prepare.outputs.meta-tags }}
      set-meta-labels: true
      meta-labels: |
        org.opencontainers.image.title=Datacube Explorer
        org.opencontainers.image.description=Web-based exploration of Open Data Cube collections
        org.opencontainers.image.vendor=Open Data Cube
        org.opencontainers.image.licenses=Apache-2.0
        org.opencontainers.image.source=${{ needs.prepare.outputs.repo-url }}
        org.opencontainers.image.url=${{ needs.prepare.outputs.repo-url }}
        org.opencontainers.image.documentation=https://datacube-explorer.readthedocs.io
        org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      build-args: |
        ENVIRONMENT=deployment
        EXPLORER_VERSION=${{ needs.prepare.outputs.version }}
        SOURCE_DATE_EPOCH=${{ needs.prepare.outputs.source-date-epoch }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # Add GitHub-native artifact attestations for every pushed image.
  #
  # The github-builder workflow above signs SLSA provenance and embeds it in the
  # image index (verifiable with `cosign verify-attestation` / `docker buildx
  # imagetools inspect`), but it does NOT push to GitHub's attestation store /
  # the OCI Referrers API (see docker/github-builder#183). Without that,
  # `gh attestation verify oci://...` and the repo Attestations UI don't work.
  #
  # This job re-adds that GitHub-native attestation by attesting the pushed
  # image digest. `needs.build.outputs.digest` is the index (manifest list)
  # digest, so attesting it makes `gh attestation verify oci://<image>:<tag>`
  # succeed (the tag resolves to that index digest).
  attest:
    needs: [prepare, build]
    # Attest whenever the build job actually pushed an image (every run of this
    # workflow pushes; there is no pull_request trigger). Guarded on the build
    # digest so it is skipped if the build produced nothing.
    if: needs.build.outputs.digest != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # mint the OIDC token used to sign the attestation
      contents: read         # required by the action
      packages: write        # push the attestation alongside the image in GHCR
      attestations: write    # write the attestation to the GitHub store
    steps:
      # Login is required only because of `push-to-registry: true` below:
      # attest-build-provenance writes the signed attestation as an OCI referrer
      # manifest into GHCR (so `gh attestation verify oci://...` can resolve it
      # from the registry), which needs registry write auth. The GitHub-store
      # copy (Attestations UI) is written via the API and needs no login.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest image provenance
        # v4+ of this action is a thin wrapper over actions/attest; either works.
        # Keeping the purpose-built provenance action for its simpler inputs.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Fully-qualified image name, no tag (per action requirements).
          subject-name: ${{ needs.prepare.outputs.meta-images }}
          # Index/manifest-list digest of the image the build job pushed.
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
