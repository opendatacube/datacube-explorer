---
name: Docker Image

on: # yamllint disable-line rule:truthy
  pull_request:
    paths: &paths
      - '**'
      - '!docs/**'
      - '!integration_tests/**'
      - '!*.rst'
      - '!*.md'
      - '!.github/**'
      - '.github/workflows/deployment_test.yaml'

  push:
    branches:
      - develop
      - integrate_1.9
    paths: *paths

env:
  DOCKER_IMAGE: ghcr.io/opendatacube/explorer:tests

permissions: {}

# When a PR is updated, cancel the jobs from the previous version. Merges
# do not define head_ref, so use run_id to never cancel those jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  deployment-image-test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get and log unstable git tag
        run: |
          set -ex
          UNSTABLE_TAG=$(git describe --tags)
          echo "UNSTABLE_TAG=$UNSTABLE_TAG" >> $GITHUB_ENV
          EXPLORER_VERSION=$(git describe --tags | sed 's#\-g#+g#')
          echo "EXPLORER_VERSION=$EXPLORER_VERSION" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build deployment Docker
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          file: Dockerfile
          context: .
          build-args: |
            EXPLORER_VERSION=${{ env.EXPLORER_VERSION }}
          tags: ${{ env.DOCKER_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare explorer schema
        run: |
          export LOCAL_UID=$(id -u $USER)
          export LOCAL_GID=$(id -g $USER)
          make up-prod
          make init-odc
          make schema

      - name: Test ping
        run: |
          curl --show-error --fail \
          --connect-timeout 5 \
          --max-time 10 \
          --retry 5 \
          --retry-all-errors \
          --retry-delay 0 \
          --retry-max-time 40 \
          "localhost:80/products" \
          > /dev/null
